name: Build Bool IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2026.11.10.2 (must be new; existing tags are never overwritten)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "Version must look like YYYY.MM.DD.N, got: ${{ inputs.version }}"
            exit 1
          fi

      - name: Environment info
        run: |
          xcodebuild -version
          ls "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/"

      - name: Patch libarchive SDK path to the runner's SDK
        run: |
          DEV_DIR="$(xcode-select -p)"
          SDK=$(ls "$DEV_DIR/Platforms/iPhoneOS.platform/Developer/SDKs/" | grep '^iPhoneOS' | sort -V | tail -1)
          echo "Using SDK: $SDK"
          sed -i '' "s|iPhoneOS26\.2\.sdk|$SDK|" Erosion.xcodeproj/project.pbxproj

      - name: Install ldid
        run: brew install ldid

      - name: Test profile serialization with harmless fixture plists
        run: python3 verify-profile-serialization.py

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Verify packaged app and rename to Bool.ipa
        run: |
          mv Erosion.ipa Bool.ipa
          rm -rf /tmp/boolcheck && mkdir -p /tmp/boolcheck
          unzip -q Bool.ipa -d /tmp/boolcheck
          APP=$(ls /tmp/boolcheck/Payload)
          echo "Packaged app bundle: $APP"
          echo -n "CFBundleDisplayName: "
          /usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "/tmp/boolcheck/Payload/$APP/Info.plist"
          ls "/tmp/boolcheck/Payload/$APP" | grep -iE 'Assets.car|AppIcon' || echo 'no Assets.car found'

      - name: Upload Bool.ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bool-ipa
          path: Bool.ipa
          retention-days: 14

      - name: Create release (fails if the tag already exists; never overwrites)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" Bool.ipa \
            --title "Bool ${{ inputs.version }}" \
            --notes "Unsigned Bool correction build. Dynamic Island uses real system layout profiles, not a continuous height slider. Corrects iPhone 14 Pro profile (2556), reattaches nested plist edits and verifies the saved subtype before success/respring. Does not provide arbitrary sub-notch placement. No display-resolution changes or new injection/exploit code. Compiled and fixture-tested, not device-verified. Install over the existing app to preserve its saved original cache. Sideload with your own Apple ID. See CHANGELOG.md for details."

      - name: Release summary
        run: |
          echo "## Bool ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned IPA built and released." >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
