name: Build Bool IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2026.11.10.2 (must be new; existing tags are never overwritten)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          ls "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/"

      - name: Patch libarchive SDK path to the runner's SDK
        run: |
          DEV_DIR="$(xcode-select -p)"
          SDK=$(ls "$DEV_DIR/Platforms/iPhoneOS.platform/Developer/SDKs/" | grep '^iPhoneOS' | sort -V | tail -1)
          echo "Using SDK: $SDK"
          sed -i '' "s|iPhoneOS26\.2\.sdk|$SDK|" Erosion.xcodeproj/project.pbxproj

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Verify packaged app and rename to Bool.ipa
        run: |
          mv Erosion.ipa Bool.ipa
          rm -rf /tmp/boolcheck && mkdir -p /tmp/boolcheck
          unzip -q Bool.ipa -d /tmp/boolcheck
          APP=$(ls /tmp/boolcheck/Payload)
          echo "Packaged app bundle: $APP"
          echo -n "CFBundleDisplayName: "
          /usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "/tmp/boolcheck/Payload/$APP/Info.plist"
          ls "/tmp/boolcheck/Payload/$APP" | grep -iE 'Assets.car|AppIcon' || echo 'no Assets.car found'

      - name: Create release (fails if the tag already exists; never overwrites)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" Bool.ipa \
            --title "Bool ${{ inputs.version }}" \
            --notes "Unsigned Bool build: home-screen name Bool, cloud icon, internal UI unchanged from the original project. Sideload with your own Apple ID (SideStore, AltStore, Sideloadly)."
