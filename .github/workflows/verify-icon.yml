name: Verify built icon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract compiled icon from the released IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 2026.11.10.1 --pattern Bool.ipa
          rm -rf x && mkdir x && unzip -q Bool.ipa -d x
          APP=$(ls x/Payload)
          echo "App bundle: $APP"
          ls "x/Payload/$APP" | grep -iE 'AppIcon|Assets.car' || true
          mkdir -p build-verification
          cp "x/Payload/$APP/AppIcon60x60@2x.png" build-verification/

      - name: Analyze compiled icon pixels vs source icon
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import hashlib, io, os, plistlib, glob
          from PIL import Image, ImageChops
          out = []
          appdir = glob.glob('x/Payload/*.app')[0]
          ext = os.path.join('build-verification', 'AppIcon60x60@2x.png')
          data = open(ext, 'rb').read()
          out.append(f"extracted sha256: {hashlib.sha256(data).hexdigest()}")
          img = Image.open(io.BytesIO(data)).convert('RGBA')
          out.append(f"extracted size: {img.size} mode: {Image.open(io.BytesIO(data)).mode}")
          w, h = img.size
          corners = [img.getpixel(p) for p in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)]]
          out.append(f"corner pixels RGBA: {corners}")
          center = img.getpixel((w//2, h//2))
          out.append(f"center pixel RGBA: {center}")
          # average color
          small = img.resize((8,8))
          px = list(small.getdata())
          avg = tuple(round(sum(c[i] for c in px)/len(px)) for i in range(4))
          out.append(f"average RGBA: {avg}")
          out.append("8x8 grid (hex RRGGBBAA):")
          for yy in range(8):
              row = px[yy*8:(yy+1)*8]
              out.append(' '.join('%02x%02x%02x%02x' % c for c in row))
          # compare with source icon
          srcs = glob.glob('**/bool-icon.png', recursive=True)
          out.append(f"source icon files found: {srcs}")
          if srcs:
              src = Image.open(srcs[0]).convert('RGBA').resize(img.size)
              diff = ImageChops.difference(img, src)
              stat = sum(sum(p[:3]) for p in diff.getdata()) / (img.size[0]*img.size[1]*3)
              out.append(f"mean abs RGB diff vs source (0-255): {stat:.2f}")
          # Info.plist display name
          info = plistlib.load(open(os.path.join(appdir, 'Info.plist'), 'rb'))
          out.append(f"CFBundleDisplayName: {info.get('CFBundleDisplayName')}")
          out.append(f"CFBundleName: {info.get('CFBundleName')}")
          open('build-verification/icon-report.txt','w').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY

      - name: Commit verification results
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-verification
          git commit -m "Add compiled icon pixel report" || echo "nothing to commit"
          git push
